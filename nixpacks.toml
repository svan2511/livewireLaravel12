[phases.setup]
nixPkgs = [
    "php82",
    "php82Extensions.gd",
    "php82Extensions.pdo",
    "php82Extensions.pdo_mysql",
    "php82Extensions.zip",
]

[phases.install]
cmds = [
    "composer install --no-interaction --optimize-autoloader"
]

[start]
cmd = "php artisan serve --host=0.0.0.0 --port=$PORT"
